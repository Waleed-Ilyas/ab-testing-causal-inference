[project]
name = "abtest"
version = "0.1.0"
description = "A/B testing and causal inference: ATE with proper inference, SRM and covariate-balance diagnostics, CUPED variance reduction, uplift modeling with Qini curves, and a peeking-inflates-false-positives simulation"
requires-python = ">=3.10,<3.14"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pandas>=2.2",
    "pyarrow>=15",
    "lightgbm>=4.3",
    "scikit-learn>=1.4",
    "statsmodels>=0.14",
    "mlflow>=2.12",
    "streamlit>=1.40",
    "plotly>=5.24",
    "matplotlib>=3.8",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.5", "jupyter>=1.0", "nbconvert>=7", "ipykernel>=6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/abtest"]

[tool.ruff]
line-length = 100
src = ["src", "tests", "app"]
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
